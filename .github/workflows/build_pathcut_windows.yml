name: Build Windows (path cut)

# Windows-only build of the path cut feature branch. Builds the dependencies on the first run
# (cached afterwards) and uploads the installer and portable zip as workflow artifacts.
on:
  push:
    branches:
      - feature/path-cut
  workflow_dispatch:

jobs:
  build_windows:
    name: Build Windows x64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      build-deps-only: false
      force-build: false
    secrets: inherit

  # Run the whole unit test suite (path cut tests included) on the tests this build packed.
  unit_tests_windows_x64:
    name: Unit tests Windows x64
    needs: build_windows
    if: ${{ !cancelled() && success() }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-latest
      artifact: ${{ github.sha }}-tests-windows-x64
